# Źródłowa treść bramy CI AME (docelowe miejsce: .github/workflows/ci.yml na `main`).
#
# To NIE jest prośba ani zadanie właściciela. Plik na `main` istnieje od 2026-08-27 i
# nie parsuje się (blok HTML z przepisu F0); agent nie ma uprawnień `workflows`, więc
# nie naprawia tego ani o to nie prosi — bramą sesji są `npm test`, `npm run build`
# i `npm run check` (AGENTS §2/§4, ENVIRONMENT §3, lekcje L9 i L12).
# Treść poniżej czeka wyłącznie na ewentualną, samodzielną decyzję właściciela.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy + walidacja danych
        run: npm test
      - name: Budowa indeksu
        run: npm run build
      - name: Indeks aktualny (bez niezacommitowanych zmian)
        run: |
          npm run check
          git diff --exit-code data/index.json || {
            echo "data/index.json niezgodny z wpisami — uruchom npm run build i wcommituj";
            exit 1;
          }
