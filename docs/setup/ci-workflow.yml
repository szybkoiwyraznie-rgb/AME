# LUSTRO bramy CI AME — kopia pliku .github/workflows/ci.yml z gałęzi `main`.
#
# Plik na `main` działa od PR #3 (2026-08-28, decyzja właściciela). To lustro służy
# dwu rzeczom: (a) sesja może sprawdzić, co właściwie egzekwuje CI, bez czytania
# YAML-a na GitHubie; (b) test `receptura CI jest zgodna z plikiem workflow`
# (test/dane.test.js) wyje, jeśli main i to lustro się rozjadą.
#
# Agent NIE zmienia `.github/workflows/*` (brak uprawnień `workflows`: push i API
# → 403) i NIE prosi właściciela o zmianę. Rozjazd: opisać w opisie PR i w
# docs/PROJECT_HISTORY.md, lustro zaktualizować do stanu z main.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zero zależności runtime i deweloperskich (ADR 0001) — brak `npm ci`.
      - name: Testy + walidacja danych (schemat, rama 21:9, skity, feed)
        run: npm test

      - name: Przebudowa indeksu (tools/rebuild-index.mjs)
        run: npm run build

      - name: Indeks aktualny wobec wpisów (ADR 0002)
        run: |
          npm run check
          git diff --exit-code data/index.json
          echo "data/index.json zgodny z data/manifestations/ i data/skity/"
