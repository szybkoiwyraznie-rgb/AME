name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zero zależności runtime i deweloperskich (ADR 0001) — brak `npm ci`.
      - name: Testy + walidacja danych (schemat, rama 21:9, skity, feed)
        run: npm test

      - name: Przebudowa indeksu (tools/rebuild-index.mjs)
        run: npm run build

      - name: Indeks aktualny wobec wpisów (ADR 0002)
        run: |
          npm run check
          git diff -I'"buildTime":' --exit-code data/index.json
          echo "data/index.json zgodny z data/manifestations/ i data/skity/"
